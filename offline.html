<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>PulseWatch Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f8fb;color:#172033;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.box{width:min(460px,100%);padding:28px;border:1px solid #e2e8f0;border-radius:18px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.08);text-align:center}.icon{width:56px;height:56px;margin:0 auto 15px;border-radius:16px;background:#e8f0ff;color:#2563eb;display:grid;place-items:center;font-size:24px;font-weight:800}h1{margin:0;font-size:24px}p{color:#64748b;line-height:1.6;font-size:13px;margin:10px 0 18px}button{min-height:42px;padding:0 16px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:750;cursor:pointer}
  </style>
</head>
<body><div class="box"><div class="icon">↻</div><h1>PulseWatch is offline</h1><p>The app shell is available, but website checks require an internet connection.</p><button onclick="location.reload()">Try again</button></div></body>
